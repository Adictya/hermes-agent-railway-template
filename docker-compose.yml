services:
  hermes:
    build: .
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DASHBOARD_PORT=8081
      - API_SERVER_PORT=8642
      - WEBHOOK_PORT=8645
      - ADMIN_USERNAME=admin
      - ADMIN_PASSWORD=admin
    volumes:
      - hermes-data:/data

volumes:
  hermes-data:
